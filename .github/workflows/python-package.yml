
name: CI

on:
  push:
  pull_request:

env:
  # Run documentation, publishing and live integrations on this Python version.
  PRIMARY_PYTHON_VERSION: "3.14"

jobs:
  python:

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        # Release tags supply the dates and publication filter for RSS feeds.
        fetch-depth: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == env.PRIMARY_PYTHON_VERSION && '0' || '1' }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Pre-install
      run: |
        python -m pip install --upgrade pip
        pip install --no-deps .
        python -c "import bussilab"
        bussilab -h
        pip uninstall --yes bussilab
    - name: Install
      run: |
        pip install .
    - name: Install viennarna # needed to test rna2d
      # avoid slow builds in cases where binary is not available
      if: contains(fromJson('["3.10","3.11","3.12","3.13"]'), matrix.python-version)
      run: |
        pip install viennarna
    - name: Test with pytest
      run: |
        bussilab check --import
        pip install pytest pytest-cov
        pytest -v
        NUMBA_DISABLE_JIT=1 PYTHONPATH=$PWD pytest -v --cov=bussilab --cov-report=term --cov-report=xml:coverage.xml
    - name: Test live Slack integration
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == env.PRIMARY_PYTHON_VERSION }}
      env:
        BUSSILAB_TEST_NOTIFY_TOKEN: ${{ secrets.BUSSILAB_TEST_NOTIFY_TOKEN }}
        BUSSILAB_TEST_NOTIFY_CHANNEL: ${{ secrets.BUSSILAB_TEST_NOTIFY_CHANNEL }}
      run: |
        if [ -n "$BUSSILAB_TEST_NOTIFY_TOKEN" ] && [ -n "$BUSSILAB_TEST_NOTIFY_CHANNEL" ]; then
          pytest -v tests/test_notify.py::TestNotify
        else
          echo "Skipping live Slack integration: credentials are unavailable."
        fi
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        use_oidc: true
        fail_ci_if_error: false
    - name: Pyflakes
      run: |
        pip install --upgrade pyflakes
        pyflakes bussilab
    - name: Pylint
      run: |
        pip install --upgrade  pylint
        pylint -E bussilab
#   - name: Mypy
#     run: |
#       pip install --upgrade  mypy
#       mypy bussilab
    - name: Flake8
      run: |
        pip install --upgrade flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 bussilab bin --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics | tee flake8_report.txt
    - name: Doc
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == env.PRIMARY_PYTHON_VERSION }}
      run: |
        pip install --upgrade pdoc3 jupyter nbconvert feedgen Markdown
        pdoc3 -f --html -o doc/ bussilab
        python -m unittest discover -s .ci -p 'test_generate_rss.py'
        python .ci/generate_rss.py
        ( cd examples && ./render.sh )
        mkdir doc/examples
        cp examples/*html doc/examples/
        sudo apt-get update
        ( sudo apt-get install tree && cd doc/examples && tree -H '.' -L 1 --noreport --charset utf-8 > index.html )
        ( sudo apt-get install pandoc texlive-xetex && pdoc3 -f --pdf bussilab > bussilab.md && pandoc --metadata=title:"Py-Bussilab Documentation" --from=markdown+abbreviations+tex_math_single_backslash --pdf-engine=xelatex --toc --toc-depth=4 --output=doc/bussilab.pdf bussilab.md )
    - name: Push doc to GitHub Pages
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == env.PRIMARY_PYTHON_VERSION && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DOC_DEPLOY_KEY }}" > ~/.ssh/doc_deploy_key
        chmod 600 ~/.ssh/doc_deploy_key
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        git config --global core.sshCommand "ssh -i ~/.ssh/doc_deploy_key -o IdentitiesOnly=yes"
        .ci/pushdoc
    - name: Upload doc to artifact
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == env.PRIMARY_PYTHON_VERSION }}
      uses: actions/upload-artifact@v7
      with:
        path: doc
        name: doc
    - name: Upload Flake8 report
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == env.PRIMARY_PYTHON_VERSION }}
      uses: actions/upload-artifact@v7
      with:
        path: flake8_report.txt
        name: flake8_report
    - name: Deploy PyPI
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == env.PRIMARY_PYTHON_VERSION && startsWith(github.ref, 'refs/tags/') }}
      env:
        BUSSILABBOT_PYPI: ${{ secrets.BUSSILABBOT_PYPI }}
      run: |
        python -m pip install --upgrade pip setuptools twine
        python setup.py sdist
        python -m twine upload -u __token__ -p "$BUSSILABBOT_PYPI" dist/bussilab-*.tar.gz

  conda:

    defaults:
      run:
        shell: bash -el {0}
    env:
      CONDA_BLD_PATH: ${{ runner.temp }}/conda-bld
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
     
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up conda
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        activate-environment: build
        python-version: "3.14"
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: true
    - name: Install conda-build
      run: |
        conda install --yes conda-build
    - name: Build
      run: |
        python make_conda_recipe.py
        export CPU_COUNT=2
        conda build --no-anaconda-upload --package-format 2 -c conda-forge conda
        rm -fr bussilab # make sure this is not imported by mistake in tests
        ls -lh "$CONDA_BLD_PATH"/noarch/py-bussilab*.conda
    - name: Test 3.8
      run: |
        conda create --yes -n py38 --override-channels -c "$CONDA_BLD_PATH" -c conda-forge python=3.8 py-bussilab pytest
        conda activate py38
        pytest -v
    - name: Test 3.9
      run: |
        conda create --yes -n py39 --override-channels -c "$CONDA_BLD_PATH" -c conda-forge python=3.9 py-bussilab pytest
        conda activate py39
        pytest -v
    - name: Test 3.10
      run: |
        conda create --yes -n py310 --override-channels -c "$CONDA_BLD_PATH" -c conda-forge python=3.10 py-bussilab pytest
        conda activate py310
        pytest -v
    - name: Test 3.11
      run: |
        conda create --yes -n py311 --override-channels -c "$CONDA_BLD_PATH" -c conda-forge python=3.11 py-bussilab pytest
        conda activate py311
        pytest -v
    - name: Test 3.12
      run: |
        conda create --yes -n py312 --override-channels -c "$CONDA_BLD_PATH" -c conda-forge python=3.12 py-bussilab pytest
        conda activate py312
        pytest -v
    - name: Test 3.13
      run: |
        conda create --yes -n py313 --override-channels -c "$CONDA_BLD_PATH" -c conda-forge python=3.13 py-bussilab pytest
        conda activate py313
        pytest -v
    - name: Test 3.14
      run: |
        conda create --yes -n py314 --override-channels -c "$CONDA_BLD_PATH" -c conda-forge python=3.14 py-bussilab pytest
        conda activate py314
        pytest -v
    - name: Test 3.15
      run: |
        conda create --yes -n py315 --override-channels -c "$CONDA_BLD_PATH" -c conda-forge python=3.15 py-bussilab pytest
        conda activate py315
        pytest -v
    - name: Save conda package
      if: ${{ matrix.os == 'ubuntu-latest' }}
      uses: actions/upload-artifact@v7
      with:
        name: conda-package
        path: ${{ env.CONDA_BLD_PATH }}/noarch/py-bussilab*.conda
        if-no-files-found: error

  publish-conda:
    needs: conda
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Download tested conda package
      uses: actions/download-artifact@v8
      with:
        name: conda-package
        path: conda-package
    - name: Check publication inputs
      env:
        CONDA_UPLOAD_TOKEN: ${{ secrets.CONDA_UPLOAD_TOKEN }}
      run: |
        if [ -z "$CONDA_UPLOAD_TOKEN" ]; then
          echo "::error::CONDA_UPLOAD_TOKEN is required for release publication."
          exit 1
        fi
        ls -lh conda-package/py-bussilab*.conda
    - name: Deploy conda
      uses: anaconda/actions/upload-package@v0.3.1
      with:
        token: ${{ secrets.CONDA_UPLOAD_TOKEN }}
        channel: bussilab
        labels: main
        packages: conda-package/py-bussilab*.conda
        force: true
